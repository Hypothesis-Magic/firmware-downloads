<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Firmware Downloads · Hypothesis Magic</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
<main>
  <header><h1><span data-t="title">韌體下載</span><small>Hypothesis Magic</small></h1><label class="language"><span class="sr-only" data-t="language">語言</span><select id="language"><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label></header>
  <section id="locked" aria-labelledby="unlock-heading">
    <h2 id="unlock-heading"><span class="step" aria-hidden="true">01</span><span data-t="unlockTitle">解鎖下載清單</span></h2>
    <form id="unlock-form" autocomplete="off">
      <label class="file-label" for="access-key">Access Key</label>
      <div class="key-row"><input id="access-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="HMF1-…" required><button id="unlock" type="submit" class="primary" data-t="unlock">解鎖</button></div>
    </form>
    <button id="use-saved" type="button" hidden data-t="useSaved">使用已記住的金鑰</button>
  </section>
  <section id="unlocked" hidden>
    <div class="toolbar"><h2><span class="step" aria-hidden="true">02</span><span data-t="available">可下載韌體</span></h2><div class="actions"><button id="remember" type="button" data-t="remember">記住這把 Access Key</button><button id="lock" type="button" data-t="lock">鎖定</button></div></div>
    <div id="projects"></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <footer><span id="storage-state"></span><button id="forget" type="button" hidden data-t="forget">忘記金鑰並鎖定</button></footer>
  <noscript>請啟用 JavaScript 以解密韌體 / JavaScript is required to decrypt firmware.</noscript>
</main>
</body>
</html>
